top_issues:
  - id: 'TEST-003'
    severity: low
    category: tests
    finding: >-
      Verificação em navegador real (clicar, ver o card renderizado com o valor novo) não foi
      feita nesta sessão — não há ferramenta de automação de navegador disponível. A verificação
      foi feita via curl contra o servidor de desenvolvimento real (dado real de produção, não
      mock) e via testes automatizados da lógica de decisão (mesmo padrão da Story 1.6, TEST-001).
    suggested_action: 'Uma passada visual manual no navegador antes do deploy é recomendada, não bloqueante.'
  - id: 'DOC-002'
    severity: low
    category: docs
    finding: >-
      attachValorPorteAnestesico usa concatenação de string (`versao|codigo_porte`) como chave
      composta do Map. Funciona corretamente porque nenhum valor de `versao` contém "|", mas é um
      padrão frágil se um dado futuro introduzir esse caractere.
    suggested_action: 'Trocar por uma chave estruturada (ex: Map aninhado ou array de tuplas) se o padrão for reaproveitado em outro lugar. Não vale reescrever só por isso agora.'

dev_decisions_review:
  - decision: 'Lookup só em /api/search, não duplicado em /api/chat'
    verdict: 'Correta e verificada — page.jsx confirma que /api/chat recebe o resultado pronto.'
  - decision: 'RESPONSE_FIELDS separado de RESULT_FIELDS'
    verdict: >-
      Correta e necessária: RESULT_FIELDS vira SELECT_COLUMNS da query real no Supabase — incluir
      um campo calculado lá quebraria a busca (coluna inexistente). Boa pega evitar isso antes de
      testar contra o banco real.
  - decision: 'porte_anestesico === 0 mostra código bruto "0", não "Sem anestesia"'
    verdict: >-
      Desvio do texto literal do AC3, mas correto: o @dev conferiu o comportamento PRÉ-EXISTENTE
      real (não o que o AC presumia) e preservou-o, seguindo a instrução central do próprio AC
      ("mantém o comportamento atual"). Documentado com transparência no Dev Agent Record e em
      teste. Aprovado.

no_invention_check:
  article_iv: PASS
  note: >-
    Mapeamento com fonte primária citada, rejeitando explicitamente a fonte de terceiro
    incorreta (Rivio). Rotulagem "valor do anestesista" impede a leitura de um total inexistente.
    Nenhum valor é inventado para edição sem dado cadastrado — vira "Não consta na fonte".

blocked_by_external:
  - >-
    Achado durante a verificação da Story 1.8 (mesma branch): o modelo `llama-3.1-8b-instant`
    usado por /api/chat não existe mais na API da Groq. Isso não afeta esta story diretamente
    (o valor aparece corretamente no `system prompt` construído, verificado por teste com mock de
    fetch), mas impede confirmar manualmente a resposta real da LLM em produção até ser corrigido.

