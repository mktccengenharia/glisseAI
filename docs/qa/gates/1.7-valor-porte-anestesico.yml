schema: 1
story: '1.7'
story_title: 'Valor em R$ do Porte Anestésico'
gate: CONCERNS
status_reason: >-
  Os 5 ACs foram verificados independentemente no código (não só no relato do @dev) e passam.
  O mapeamento porte_anestesico -> porte CBHPM confere exatamente com a fonte oficial citada
  (docs/research/2026-08-17-fundamentos-faturamento-cbhpm/02-research-report.md#3.5), a busca
  por edição está correta (nunca cruza valor de outra edição), e a rotulagem "valor do
  anestesista" está presente no card e no chat, sem soma a outro total. Ressalva não bloqueante:
  verificação em navegador real não foi possível nesta sessão (sem ferramenta disponível).
reviewer: 'Quinn (Test Architect)'
reviewed_revision: 'commit:bad679a (branch feat/1.7-valor-porte-anestesico, local, não mesclada ainda com main)'
