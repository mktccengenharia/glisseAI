evidence:
  lint: 'npm run lint — sem warnings/erros (executado pelo QA, independente do relato do @dev)'
  tests: 'npm test — 120/120 passando (executado pelo QA na branch com 1.7+1.8 mescladas; 95 eram só da 1.7)'
  build: 'npm run build a partir de .next limpo — verde'
  mapeamento_conferido: >-
    PORTE_ANESTESICO_PARA_CBHPM em src/app/api/search/route.js:121-130 comparado caractere a
    caractere contra a tabela do relatório de pesquisa, seção 3.5 (1=3A, 2=3C, 3=4C, 4=6B, 5=7C,
    6=9B, 7=10C, 8=12A) — idêntico. Confirmado que a correspondência da Rivio (rejeitada pela
    pesquisa) não aparece em nenhum lugar do código.
  busca_por_edicao: >-
    attachValorPorteAnestesico (route.js:145-172) constrói a chave de lookup como
    `${row.versao}|${row.codigo_porte}` a partir das linhas REAIS devolvidas pelo Supabase, não
    do filtro `.in()` bruto — mesmo que o filtro devolva combinações de versão/código que não
    formam um par real, o Map só é populado com pares que de fato existem no banco. Sem risco de
    cruzar valor de uma edição errada.
  fonte_unica_do_lookup: >-
    Confirmado em page.jsx:367-386 que o client passa searchData.results direto como `procedures`
    para POST /api/chat — porteAnestesicoLine (chat/route.js:71-86) só LÊ p.valor_porte_anestesico,
    não refaz a busca. Union verificada, não é suposição do @dev.

