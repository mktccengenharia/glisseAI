    verdict: 'Correta como implementação, escalada corretamente. Ver UX-001.'
  - decision: 'Não formatar custo_operacional/custo_filme_doc como R$'
    verdict: >-
      CORRETA e exemplar quanto ao Article IV. Confirmado que são multiplicadores:
      05-import-to-supabase.mjs:95 calcula valor_uco = custo_operacional * valor_uco_da_vigência.
      Formatá-los como moeda inventaria uma unidade que a CBHPM não fornece.
  - decision: 'Frase única quando ambos os campos de UCO são nulos'
    verdict: 'Correta. Evita "Não consta na fonte · Não consta na fonte". Coberta em teste.'
  - decision: 'Desempate 2015/2016 por ano de edição'
    verdict: 'Correta e verificada contra editions.mjs. Era o único critério inequívoco disponível.'
  - decision: 'testTimeout 5s -> 30s'
    verdict: 'Aceitável, validada independentemente pelo QA. Ver DOC-001.'
  - decision: 'Contorno do EINVAL com rm -rf .next'
    verdict: 'Contorno legítimo de problema de ambiente, mas precisa virar solução. Ver BUILD-001.'

