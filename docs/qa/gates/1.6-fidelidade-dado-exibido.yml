top_issues:
  - id: 'BUILD-001'
    severity: medium
    category: build
    status: RESOLVED
    resolved_by: '@devops (Gage)'
    resolved_commit: 'pending'
    finding: >-
      npm run build falha de forma determinística em execução incremental com
      "EINVAL: invalid argument, readlink '.next/...'". Reproduzido 2x pelo QA (.next/package.json
      e .next/react-loadable-manifest.json). Só passa após rm -rf .next.
    analysis: >-
      NÃO é causado por esta story: a falha ocorre em recursiveDelete do .next, antes de qualquer
      compilação de código-fonte. Causa provável: repositório dentro de pasta sincronizada pelo
      OneDrive, cujos placeholders são lidos como reparse points pelo readlink do Next.
    resolution: >-
      Adicionado script "prebuild": "rimraf .next" no package.json (rimraf ^6.1.3 como devDependency
      direta). npm executa prebuild automaticamente antes de build via lifecycle hooks, eliminando
      o .next stale antes que o readlink do Next tropece nos reparse points do OneDrive. Verificado
      com dois `npm run build` consecutivos sem rm -rf manual — ambos verdes.
  - id: 'UX-001'
    severity: medium
    category: requirements
    finding: >-
      O card passou a exibir o mesmo número sob dois rótulos: "UCO" e "Custo Operacional".
      Confirmado que são o mesmo dado — os 3 scripts de import fazem `uco: r.custo_operacional`
      (14-import-cap4.mjs:108, 05-import-to-supabase.mjs:94, 08-import-multi.mjs:77).
    analysis: >-
      O @dev agiu corretamente: o AC2 pede custo_operacional explicitamente, e omitir seria
      reinterpretar escopo (Article IV). A decisão foi escalada, não escondida. O risco é de
      leitura: num sistema de faturamento, dois rótulos com o mesmo número podem ser lidos como
      dois itens cobráveis distintos.
    suggested_action: 'Decisão de produto do @po: fundir os rótulos ou manter. Story de acabamento.'
  - id: 'TEST-001'
    severity: medium
    category: tests
    finding: >-
      O teste de regressão do bug de produção (procedure-display.test.js:69-80) usa um helper
      local `derivarCard` que REPLICA a lógica do ProcedureCard em vez de exercitar o componente.
    analysis: >-
      Conferido manualmente que o helper hoje espelha page.jsx:133-135 e 162-182 exatamente, então
      o teste é fiel no estado atual e a regressão está de fato coberta. Mas ele não pega uma
      divergência futura em page.jsx — o teste continuaria verde com o componente quebrado.
      Causa raiz: a suíte roda em environment 'node', sem jsdom.
    suggested_action: >-
      Adicionar jsdom + @testing-library/react e converter esse bloco em teste de render do
      ProcedureCard. Débito técnico, não bloqueante.
  - id: 'TEST-002'
    severity: low
    category: tests
    finding: >-
      A correção do rateio de auxiliares com valor_porte nulo (page.jsx:205, decisão 4 do @dev)
      é um acerto real e da mesma classe do AC1, mas não tem teste.
    suggested_action: 'Cobrir em teste junto com TEST-001.'
  - id: 'PERF-001'
    severity: low
    category: performance
    finding: >-
      search_events passa de escrita rara (só busca vazia) para escrita em toda busca, numa tabela
      sem política de retenção nem índice.
    analysis: 'Desprezível na escala atual (piloto). A escrita é fire-and-forget e não afeta latência.'
    suggested_action: 'Monitorar volume depois que a migration da seção 11 for aplicada.'
  - id: 'DOC-001'
    severity: low
    category: docs
    finding: >-
      testTimeout foi elevado globalmente para 30s em vez de tornar preguiçoso o import de
      @huggingface/transformers, que é a causa raiz.
    analysis: >-
      Validado que não mascara teste lento (máx. individual 511ms). O @dev já registrou o import
      preguiçoso como débito técnico e deliberadamente não o implementou por estar fora dos ACs —
      decisão correta de escopo.
    suggested_action: 'Manter o débito registrado; o import preguiçoso também reduziria o cold start real da busca.'

