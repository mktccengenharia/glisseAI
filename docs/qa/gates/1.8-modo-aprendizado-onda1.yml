top_issues:
  - id: 'BUG-001'
    severity: high
    category: infra
    finding: >-
      O modelo `llama-3.1-8b-instant` usado em /api/chat (linha do fetch para a Groq) não existe
      mais na API — reproduzido pelo QA: POST /api/chat retorna 502 com
      "The model `llama-3.1-8b-instant` does not exist or you do not have access to it"
      (model_not_found). Isso derruba o chat inteiro: modo de busca normal E o modo ancorado
      desta story, igualmente.
    analysis: >-
      NÃO é causado por esta story nem pela Story 1.7 — reproduzido também no caminho de chat
      sem topicoId, código que nenhuma das duas stories tocou na linha do fetch/modelo. É uma
      quebra de produção pré-existente, só descoberta agora porque esta story testou o chat de
      ponta a ponta pela primeira vez em bom tempo.
    suggested_action: >-
      Abrir item de prioridade ALTA em opportunity-mapping.md — atualizar o nome do modelo na
      Groq (ex.: para uma versão atual da família Llama 3.1/3.3 disponível na API) antes de
      considerar QUALQUER funcionalidade de chat pronta para uso real. Encaminhar ao @pm para
      priorização; é @dev quem corrige.
  - id: 'TEST-004'
    severity: low
    category: tests
    finding: >-
      Verificação visual em navegador real (clicar entre tópicos, ver o exemplo carregar após o
      fetch assíncrono, receber e ler uma resposta real da pergunta ancorada) não foi feita —
      sem ferramenta de automação de navegador disponível na sessão.
    suggested_action: >-
      Passada manual no navegador antes do deploy, cobrindo o fluxo completo (troca de tópico,
      carregamento do exemplo, envio de pergunta). Não bloqueante: a lógica de decisão e o
      grounding do chat estão travados em teste determinístico: o que falta é confirmação visual
      de estilo/layout e da experiência assíncrona.
  - id: 'SEC-001'
    severity: low
    category: security
    finding: >-
      /api/chat aceita `topicoId` e valida contra a lista fixa de TOPICOS no servidor (bom) — mas
      não há teste explícito confirmando que um `topicoId` de tipo não-string (ex: um objeto ou
      array, tentando bypass de `typeof topicoId === 'string'`) é tratado com segurança.
    analysis: >-
      Revisão de código confirma que a validação (`typeof topicoId === 'string' ? TOPICOS.find(...) : null`)
      já cobre esse caso corretamente — qualquer valor não-string cai em `topico = null`, que
      então falha a checagem seguinte (`topicoId !== undefined && !topico`) e retorna 400. Não é
      uma vulnerabilidade real, só uma lacuna de teste explícito para esse caso específico.
    suggested_action: 'Adicionar um teste com topicoId: {} ou [] na próxima iteração, se a rota crescer.'

dev_decisions_review:
  - decision: 'Estender /api/chat com topicoId em vez de criar /api/learn-chat'
    verdict: >-
      Correta. Reaproveita rate limiting e toda a infraestrutura de chamada à Groq; menos
      superfície nova. A validação server-side do topicoId contra lista fixa é o detalhe de
      segurança certo — impede o client de injetar "contexto de lição" livre.
  - decision: 'Navegação client-side por estado, sem sub-rotas por tópico'
    verdict: 'Correta para 4 tópicos fixos. Documentada como decisão localizada se a onda 2 justificar deep-link no futuro.'
  - decision: 'Um único exemplo real reaproveitado nos 4 blocos'
    verdict: 'Aceitável — reduz complexidade sem violar o AC4, que pede "pelo menos um" real por bloco, não um diferente por bloco.'
  - decision: 'Cálculo de urgência do Bloco 3 rotulado como ilustrativo'
    verdict: >-
      Correta e é o ponto mais sensível de Article IV desta story — o banco não tem campo de
      "caráter do atendimento", então afirmar que o exemplo foi urgente de verdade seria
      inventar dado. O texto deixa isso explícito, no mesmo espírito do "Exemplo de cálculo, não
      norma" já usado pela própria pesquisa.
  - decision: 'Mesclar a branch da Story 1.7 localmente antes de terminar a 1.8'
    verdict: 'Correta — evita reconciliar duas mudanças no mesmo arquivo (chat/route.js) depois, e o Bloco 4 ganha o valor real de porte anestésico sem esforço extra.'

no_invention_check:
  article_iv: PASS
  note: >-
    Todo o conteúdo tem fonte rastreável ao relatório de pesquisa (fonte primária, PDFs oficiais).
    As 4 restrições específicas do AC3 estão implementadas E travadas em teste, não só descritas
    em prosa. O cálculo ilustrativo do Bloco 3 é o ponto de maior risco de Article IV desta story
    e foi tratado corretamente (rotulado, nunca apresentado como fato sobre o procedimento real).

