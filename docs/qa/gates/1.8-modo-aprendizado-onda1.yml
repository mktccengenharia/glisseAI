  conteudo_conferido_linha_a_linha: >-
    Os 16 parágrafos de src/lib/aprendizado-content.js comparados individualmente contra as
    seções citadas do relatório (3.1, 3.2, 3.3, 3.4, 3.5, 3.6, 1.1, 1.2, 2.1, 2.2, 2.4).
